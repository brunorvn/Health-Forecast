[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "health-forecast"
version = "0.1.0"
description = "Previs\u00e3o de demanda mensal do HC-UFPE (s\u00e9ries temporais)"
authors = [
  { name = "Bruno Reis" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "statsforecast>=1.7",
    "utilsforecast>=0.2",
    "typer>=0.9",
    "loguru>=0.7",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17,<0.18",
    "pytest>=8.0",
    "mkdocs>=1.6",
]

[tool.flit.module]
name = "sigma"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 99
src = ["sigma"]
include = ["pyproject.toml", "sigma/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.flake8-bugbear]
# typer.Option/Argument in defaults is the documented Typer pattern
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
# best-effort CSV sniffing: broad catches are intentional here
"sigma/data_preparation.py" = ["BLE001", "S110", "S112"]

[tool.ruff.lint.isort]
known-first-party = ["sigma"]
force-sort-within-sections = true

